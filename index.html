<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sungwoo's Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #14161A;
    --panel: #1C2026;
    --rule: #2C323A;
    --text: #F2F4F6;
    --text-dim: #8A93A0;
    --accent: #2FB3C9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .frame {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
  }

  /* clock */
  .clock {
    position: absolute;
    top: 32px;
    right: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clock .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(47, 179, 201, 0.15);
  }

  /* title */
  .title-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .flap-glyph {
    flex: 0 0 auto;
    display: flex;
    gap: 3px;
  }

  .flap-glyph span {
    width: 6px;
    height: 22px;
    background: var(--rule);
  }

  .flap-title {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    line-height: 1;
  }

  .flap-char {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 0.08em 0.16em 0.02em;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 56px);
    letter-spacing: 0.02em;
    color: var(--text);
    overflow: hidden;
    transform-origin: 50% 100%;
    opacity: 0;
    transform: rotateX(-90deg);
    animation: flapIn 160ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .flap-char::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: var(--bg);
    opacity: 0.7;
  }

  .flap-char.space {
    background: transparent;
    border-color: transparent;
    width: 0.5em;
    padding: 0;
  }

  .flap-char.space::after { content: none; }

  @keyframes flapIn {
    0%   { opacity: 0; transform: rotateX(-90deg); }
    60%  { opacity: 1; transform: rotateX(12deg); }
    100% { opacity: 1; transform: rotateX(0deg); }
  }

  .rule {
    height: 1px;
    background: var(--rule);
    margin: 24px 0;
    max-width: 640px;
  }

  .tagline {
    font-size: clamp(16px, 2.4vw, 20px);
    font-weight: 500;
    color: var(--text);
    margin: 0 0 32px;
    max-width: 640px;
  }

  .career {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    line-height: 1.8;
    margin-bottom: 48px;
  }

  .career .org {
    color: var(--text);
    font-weight: 600;
  }

  /* CTA */
  .enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.16em;
    padding: 12px 24px;
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 80ms ease-out, color 80ms ease-out;
    margin-bottom: 48px;
  }

  .enter-btn:hover,
  .enter-btn:focus-visible {
    background: rgba(47, 179, 201, 0.12);
  }

  .enter-btn .arrow {
    transition: transform 80ms ease-out;
  }

  .enter-btn:hover .arrow {
    transform: translateX(3px);
  }

  /* contact */
  .contact {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .contact button,
  .contact a {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    font: inherit;
    letter-spacing: inherit;
    position: relative;
    transition: color 80ms ease-out;
  }

  .contact button:hover,
  .contact button:focus-visible,
  .contact a:hover,
  .contact a:focus-visible {
    color: var(--accent);
  }

  .copy-toast {
    position: absolute;
    left: 0;
    top: -22px;
    font-size: 11px;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease-out;
    white-space: nowrap;
  }

  .copy-toast.show { opacity: 1; }

  .skip-link {
    position: absolute;
    bottom: 32px;
    left: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--rule);
    text-decoration: none;
  }

  .skip-link:hover,
  .skip-link:focus-visible {
    color: var(--text-dim);
  }

  @media (max-width: 767px) {
    .stage { padding: 24px; align-items: flex-start; padding-top: 72px; }
    .clock { top: 24px; right: 24px; }
    .flap-char { font-size: clamp(22px, 8vw, 34px); }
    .rule, .tagline { max-width: 100%; }
    .skip-link { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flap-char {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="clock" id="clock" aria-hidden="true">
    <span class="dot"></span>
    <span id="clock-text">SEL --:--</span>
  </div>

  <main class="frame">
    <div class="title-row">
      <span class="flap-glyph" aria-hidden="true"><span></span><span></span></span>
      <h1 class="flap-title" id="flap-title" aria-label="SUNGWOO'S PROJECT"></h1>
    </div>

    <div class="rule"></div>

    <p class="tagline">여행업 4년, 문제를 시스템으로 옮기는 기획자</p>

    <p class="career">
      <span class="org">HANATOUR</span> · 동남아상품팀(태국) MD · 4년<br>
      원가관리 / 신규 상품 기획
    </p>

    <a class="enter-btn" href="list.html">
      <span class="arrow">▸</span> ENTER
    </a>

    <div class="contact">
      <button type="button" id="email-copy" aria-label="이메일 주소 복사">
        doaq3210@gmail.com
        <span class="copy-toast" id="copy-toast">복사됨</span>
      </button>
      <!-- TODO: 실제 GitHub / LinkedIn URL로 교체 -->
      <a href="#" target="_blank" rel="noopener">GITHUB</a>
      <a href="#" target="_blank" rel="noopener">LINKEDIN</a>
    </div>
  </main>

  <a class="skip-link" href="list.html">SKIP INTRO →</a>
</div>

<script>
  // split-flap title
  (function () {
    var titleText = "SUNGWOO'S PROJECT";
    var container = document.getElementById('flap-title');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    titleText.split('').forEach(function (ch, i) {
      var span = document.createElement('span');
      if (ch === ' ') {
        span.className = 'flap-char space';
      } else {
        span.className = 'flap-char';
        span.textContent = ch;
        if (!reduced) {
          span.style.animationDelay = (i * 60) + 'ms';
        } else {
          span.style.animation = 'none';
        }
      }
      container.appendChild(span);
    });
  })();

  // Seoul clock
  (function () {
    var el = document.getElementById('clock-text');
    var formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Seoul',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    function tick() {
      el.textContent = 'SEL ' + formatter.format(new Date());
    }

    tick();
    setInterval(tick, 10000);
  })();

  // email copy-to-clipboard
  (function () {
    var btn = document.getElementById('email-copy');
    var toast = document.getElementById('copy-toast');
    var email = 'sungwoo@email.com';
    var timer = null;

    btn.addEventListener('click', function () {
      var showToast = function () {
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove('show'); }, 1400);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(showToast).catch(function () {
          window.location.href = 'mailto:' + email;
        });
      } else {
        window.location.href = 'mailto:' + email;
      }
    });
  })();
</script>

</body>
</html>
