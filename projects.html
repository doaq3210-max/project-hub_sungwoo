    --panel: #1C2026;
    --rule: #2C323A;
    --text: #F2F4F6;

    --accent: #2FB3C9;
    --arrived: #4FBF7B;
    --boarding: #E8A33D;
    --scheduled: #8A93A0;
    --chip-cyan: #2FB3C9;
    --chip-gray: #8A93A0;
    --chip-purple: #C77DFF;
    --chip-orange: #E8A33D;
    --chip-green: #4FBF7B;
    --chip-pink: #F2789F;
  }

  :root[data-theme="light"] {
    --bg: #F5F6F8;
    --panel: #FFFFFF;
    --rule: #DADFE5;
    --text: #14161A;
    --text-dim: #5B6472;
    --accent: #0E7490;
    --arrived: #146C3B;
    --boarding: #9C5B0A;
    --scheduled: #5B6472;
    --chip-cyan: #0E7490;
    --chip-gray: #5B6472;
    --chip-purple: #6D28D9;
    --chip-orange: #9C5B0A;
    --chip-green: #146C3B;
    --chip-pink: #BE185D;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    transition: background-color 150ms ease-out, color 150ms ease-out;
  }

  body {

  }

  body.modal-open { overflow: hidden; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: inherit; }

  /* header */
  .board-header {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 32px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: var(--text);
  }

  .nav-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 24px;
  }

  .nav-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: var(--text-dim);
    transition: color 80ms ease-out;
  }

  .nav-link:hover,
  .nav-link:focus-visible { color: var(--accent); }

  .nav-link.current { color: var(--accent); }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clock .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 15%, transparent);
  }

  .mode-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 5px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 80ms ease-out, color 80ms ease-out;
  }

  .mode-toggle:hover,
  .mode-toggle:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  .section-label {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 32px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
  }

  .page-title {
    max-width: 1120px;
    margin: 8px auto 0;
    padding: 0 32px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.02em;
  }

  /* carousel */
  .carousel-section {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 0 8px;
  }

  .carousel-viewport {
    overflow-x: auto;
    overflow-y: visible;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    padding: 12px 32px 28px;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }

  .carousel-track {
    display: flex;
    gap: 20px;
    width: max-content;
  }

  .carousel-card {
    --card-accent: var(--accent);
    position: relative;
    flex: 0 0 min(82vw, 300px);
    width: min(82vw, 300px);
    min-height: 380px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--card-accent);
    border-radius: 2px;
    padding: 24px;
    scroll-snap-align: center;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 160ms ease-out;
  }

  .carousel-card:not(.is-open):hover,
  .carousel-card:not(.is-open):focus-visible {
    transform: translateY(-4px);
    border-color: var(--card-accent);
  }

  .carousel-card:not(.is-open) {
    transition: transform 160ms ease-out, border-color 160ms ease-out;
  }

  .carousel-card[data-status="scheduled"] { cursor: default; }
  .carousel-card[data-status="scheduled"] .card-hint { color: var(--scheduled); }

  .card-placeholder {
    visibility: hidden;
    border-top-color: transparent;
  }

  .card-face {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .card-no {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--card-accent);
  }

  .card-title {
    margin: 0 0 12px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: 0;
    color: var(--text);
  }

  .card-summary {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
    flex: 1;
    white-space: pre-line;
  }

  .card-hint {
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--card-accent);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .status-arrived { color: var(--arrived); }
  .status-arrived .dot { background: var(--arrived); }

  .status-boarding { color: var(--boarding); }
  .status-boarding .dot {
    background: var(--boarding);
    animation: pulse 3s ease-in-out infinite;
  }

  .status-scheduled { color: var(--scheduled); }
  .status-scheduled .dot {
    background: transparent;
    border: 1px solid var(--scheduled);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* carousel controls */
  .carousel-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 32px 8px;
  }

  .car-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 80ms ease-out, color 80ms ease-out;
  }

  .car-btn:hover,
  .car-btn:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  .car-dots {
    display: flex;
    gap: 8px;
  }

  .car-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rule);
    border: none;
    padding: 0;
    cursor: pointer;
  }

  .car-dot.active { background: var(--accent); }

  /* detail (flip-expanded card) */
  .card-detail { display: none; }

  .carousel-card.is-open {
    position: fixed;
    inset: 0;
    margin: auto;
    width: min(640px, 92vw);
    height: min(720px, 86vh);
    z-index: 100;
    cursor: default;
    padding: 0;
    border-color: var(--rule);
  }

  .carousel-card.is-open .card-face { display: none; }

  .carousel-card.content-visible .card-face { display: none; }
  .carousel-card.content-visible .card-detail {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .detail-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 24px 24px 0;
  }

  .detail-title-group { flex: 1; min-width: 0; }

  .detail-no {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .detail-title {
    margin: 0 0 8px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .detail-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    flex: 0 0 auto;
    transition: color 80ms ease-out;
  }

  .detail-close:hover,
  .detail-close:focus-visible { color: var(--text); }

  .detail-rule {
    height: 1px;
    background: var(--rule);
    margin: 16px 24px 0;
  }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 24px;
    opacity: 0;
    transition: opacity 220ms ease-out;
  }

  .carousel-card.content-visible .detail-body { opacity: 1; }

  .detail-section { margin-bottom: 24px; }
  .detail-section:last-of-type { margin-bottom: 0; }

  .detail-section h3 {
    margin: 0 0 8px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--text);
  }

  .detail-section p {
    margin: 0;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    letter-spacing: 0;
    max-width: 70ch;
    color: var(--text);
  }

  .detail-section ul {
    margin: 0;
    padding-left: 18px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    letter-spacing: 0;
  }

  .detail-section li { margin-bottom: 6px; }
  .detail-section li:last-child { margin-bottom: 0; }

  .detail-live-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--card-accent, var(--accent));

  }

  .detail-live-link:hover,
  .detail-live-link:focus-visible { text-decoration: underline; }

  .detail-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    margin-top: 20px;
    border-top: 1px solid var(--rule);
  }

  .stack-tag {
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 4px 10px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--text-dim);
  }

  /* scrim */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.72);
    z-index: 90;
    opacity: 0;
    transition: opacity 200ms ease-out;
  }

  .scrim[hidden] { display: none; }
  .scrim.show { opacity: 1; }

  @media (max-width: 767px) {
    .board-header { padding: 24px 20px 8px; }
    .section-label { padding: 20px 20px 0; }
    .carousel-viewport { padding: 12px 20px 24px; }
    .carousel-controls { padding: 0 20px 4px; }
    .page-title { padding: 0 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status-boarding .dot { animation: none; opacity: 1; }
    .scrim { transition: none; }
    .carousel-card:not(.is-open) { transition: none; }
    .detail-body { transition: none; }
    html, body { transition: none !important; }
  }
</style>

      no: '08',
      name: 'MOODY WALK',
      summary: '산책 중 사진을 기록하면 Gemini가 분위기에 맞는 캡션을 달아주는 감성 산책 기록 PWA입니다.\n카드를 클릭하면 상세 정보를 볼 수 있습니다.',
      status: 'arrived',
      isDemo: true,
      detail: {
        description: 'Vite + React로 만든 PWA로, 산책 중 남긴 사진과 위치를 Supabase에 기록하고 Gemini가 사진 분위기에 어울리는 캡션을 자동으로 붙여줍니다.',
        demoLink: 'https://moody-walk-app-pgfa.vercel.app/',
        stack: ['Vite', 'React', 'Supabase', 'Gemini API', 'PWA']
      }
    }
  ];

  var track = document.getElementById('carousel-track');
  var dotsWrap = document.getElementById('car-dots');
  var viewport = document.getElementById('carousel-viewport');
  var scrim = document.getElementById('scrim');
  var openCard = null;
  var placeholder = null;

  function section(heading, html) {
    if (!html) return '';
    return '<div class="detail-section"><h3>' + heading + '</h3>' + html + '</div>';
  }

  function buildDetailHTML(project) {
    var d = project.detail;
    var html = '';
    html += section('소개', d.description ? '<p>' + d.description + '</p>' : '');
    html += section('라이브 데모', d.demoLink ? '<p><a class="detail-live-link" href="' + d.demoLink + '" target="_blank" rel="noopener">사이트 바로가기 ↗</a></p>' : '');
    html += section('문제 정의', d.problem ? '<p>' + d.problem + '</p>' : '');
    html += section('내 역할 · 기여도', d.role ? '<p>' + d.role + '</p>' : '');
    if (d.process && d.process.length) {
      html += section('진행 과정 · 의사결정', '<ul>' + d.process.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>');
    }
    html += section('결과 · 성과', d.result ? '<p>' + d.result + '</p>' : '');
    if (d.stack && d.stack.length) {
      html += '<div class="detail-stack">' + d.stack.map(function (s) { return '<span class="stack-tag">' + s + '</span>'; }).join('') + '</div>';
    }
    return html;
  }

  function buildCard(project, index) {
    var color = CARD_COLORS[index % CARD_COLORS.length];
    var card = document.createElement('article');
    card.className = 'carousel-card';
    card.dataset.status = project.status;
    card.style.setProperty('--card-accent', color);
    card.tabIndex = 0;

    var statusHTML = '<span class="status status-' + project.status + '"><span class="dot"></span>' + STATUS_LABEL[project.status] + '</span>';
    var hintText = project.isDemo ? '사이트 바로가기 →' : '자세히 보기 →';

    var faceHTML =
      '<div class="card-face">' +
        '<div class="card-top">' +
          '<span class="card-no mono">' + project.no + '</span>' +
          statusHTML +
        '</div>' +
        '<h2 class="card-title">' + project.name + '</h2>' +
        '<p class="card-summary">' + project.summary + '</p>' +
        '<span class="card-hint">' + hintText + '</span>' +
      '</div>';

    card.innerHTML = faceHTML;

    card.setAttribute('role', 'button');
    card.setAttribute('aria-haspopup', 'dialog');
    card.setAttribute('aria-expanded', 'false');
    card.setAttribute('aria-label', project.name + ' 상세 보기, 상태 ' + STATUS_LABEL[project.status]);

    var detailWrap = document.createElement('div');
    detailWrap.className = 'card-detail';
    detailWrap.innerHTML =
      '<div class="detail-header">' +
        '<div class="detail-title-group">' +
          '<span class="detail-no mono">' + project.no + '</span>' +
          '<h2 class="detail-title">' + project.name + '</h2>' +
          statusHTML +
        '</div>' +
        '<button class="detail-close" type="button" aria-label="닫기">✕</button>' +
      '</div>' +
      '<div class="detail-rule"></div>' +
      '<div class="detail-body">' + buildDetailHTML(project) + '</div>';
    card.appendChild(detailWrap);

    card.addEventListener('click', function (e) {
      if (card.classList.contains('is-open')) return;
      openDetail(card);
    });

    detailWrap.querySelector('.detail-close').addEventListener('click', function (e) {
      e.stopPropagation();
      closeDetail();
    });

    card.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && !card.classList.contains('is-open')) {
        e.preventDefault();
        card.click();
      }
    });

    return card;
  }

  projects.forEach(function (project, i) {
    track.appendChild(buildCard(project, i));

    var dot = document.createElement('button');
    dot.className = 'car-dot';
    dot.type = 'button';
    dot.setAttribute('aria-label', project.name + '로 이동');
    dot.addEventListener('click', function () {
      var cards = track.querySelectorAll('.carousel-card');
      cards[i].scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
    });
    dotsWrap.appendChild(dot);
  });

  var dots = dotsWrap.querySelectorAll('.car-dot');

  function updateActiveDot() {
    var cards = Array.prototype.slice.call(track.querySelectorAll('.carousel-card'));
    var center = viewport.scrollLeft + viewport.clientWidth / 2;
    var closest = 0;
    var minDist = Infinity;
    cards.forEach(function (c, i) {
      var mid = c.offsetLeft + c.offsetWidth / 2;
      var dist = Math.abs(mid - center);
      if (dist < minDist) { minDist = dist; closest = i; }
    });
    dots.forEach(function (d, i) { d.classList.toggle('active', i === closest); });
  }

  var scrollTimer = null;
  viewport.addEventListener('scroll', function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(updateActiveDot, 80);
  });
  updateActiveDot();

  document.getElementById('car-prev').addEventListener('click', function () {
    viewport.scrollBy({ left: -320, behavior: REDUCED ? 'auto' : 'smooth' });
  });
  document.getElementById('car-next').addEventListener('click', function () {
    viewport.scrollBy({ left: 320, behavior: REDUCED ? 'auto' : 'smooth' });
  });

  // Flip open / close
  function openDetail(card) {
    if (openCard) return;
    openCard = card;

    placeholder = document.createElement('div');
    placeholder.className = 'carousel-card card-placeholder';
    card.parentNode.insertBefore(placeholder, card);

    var state = Flip.getState(card, { props: 'borderRadius' });

    document.body.appendChild(card);
    card.classList.add('is-open');
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-modal', 'true');
    card.setAttribute('aria-expanded', 'true');
    card.tabIndex = -1;

    document.body.classList.add('modal-open');
    scrim.hidden = false;
    requestAnimationFrame(function () { scrim.classList.add('show'); });

    Flip.from(state, {
      duration: REDUCED ? 0 : 0.6,
      ease: 'power3.inOut',
      scale: true,
      onComplete: function () {
        gsap.set(card, { clearProps: 'transform,borderRadius' });
        card.classList.add('content-visible');
        var closeBtn = card.querySelector('.detail-close');
        if (closeBtn) closeBtn.focus();
      }
    });

    document.addEventListener('keydown', onKeydown);
  }

  function closeDetail() {
    if (!openCard) return;
    var card = openCard;

    card.classList.remove('content-visible');

    var state = Flip.getState(card, { props: 'borderRadius' });

    placeholder.replaceWith(card);
    card.classList.remove('is-open');
    card.setAttribute('role', 'button');
    card.removeAttribute('aria-modal');
    card.setAttribute('aria-expanded', 'false');
    card.tabIndex = 0;
    scrim.classList.remove('show');

    Flip.from(state, {
      duration: REDUCED ? 0 : 0.45,
      ease: 'power2.inOut',
      scale: true,
      onComplete: function () {
        gsap.set(card, { clearProps: 'transform,borderRadius' });
        document.body.classList.remove('modal-open');
        scrim.hidden = true;
        card.focus();
        updateActiveDot();
      }
    });

    openCard = null;
    placeholder = null;
    document.removeEventListener('keydown', onKeydown);
  }

  function onKeydown(e) {
    if (e.key === 'Escape') closeDetail();
  }

  scrim.addEventListener('click', closeDetail);

  // clock
  (function () {
    var el = document.getElementById('clock-text');
    var formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Seoul',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    function tick() { el.textContent = 'SEL ' + formatter.format(new Date()); }
    tick();
    setInterval(tick, 10000);
  })();

  // theme toggle
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('mode-toggle');
    var label = document.getElementById('mode-toggle-text');

    function applyLabel(theme) {
      label.textContent = theme === 'light' ? 'DARK' : 'LIGHT';
      btn.setAttribute('aria-label', theme === 'light' ? '다크 모드로 전환' : '라이트 모드로 전환');
    }

    applyLabel(root.getAttribute('data-theme') || 'dark');

    btn.addEventListener('click', function () {
      var next = (root.getAttribute('data-theme') || 'dark') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      applyLabel(next);
    });
  })();
</script>

</body>
</html>
