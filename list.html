<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴 | Sungwoo's Project Hub</title>
<meta name="description" content="Capabilities, Portfolio, Projects 세 영역으로 구성된 김성우의 프로젝트 허브 메뉴입니다. 원하는 항목을 선택해 자세히 살펴보세요.">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      var l = localStorage.getItem('lang');
      if (l === 'en') document.documentElement.setAttribute('lang', 'en');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #14161A;
    --panel: #1C2026;
    --rule: #2C323A;
    --text: #F2F4F6;
    --text-dim: #8A93A0;
    --accent: #2FB3C9;
    --chip-cyan: #2FB3C9;
    --chip-orange: #E8A33D;
    --chip-green: #4FBF7B;
  }

  :root[data-theme="light"] {
    --bg: #F7F2E7;
    --panel: #FFFFFF;
    --rule: #DADFE5;
    --text: #14161A;
    --text-dim: #5B6472;
    --accent: #0E7490;
    --chip-cyan: #0E7490;
    --chip-orange: #9C5B0A;
    --chip-green: #146C3B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    transition: background-color 150ms ease-out, color 150ms ease-out;
  }

  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: inherit; }

  /* header */
  .board-header {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 32px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: var(--text);
  }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clock .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 15%, transparent);
  }

  .mode-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 5px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 80ms ease-out, color 80ms ease-out;
  }

  .mode-toggle:hover,
  .mode-toggle:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  .header-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 16px;
  }

  .section-label {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 32px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
  }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 8px 32px 96px;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.02em;
    margin: 8px 0 40px;
  }

  .hub-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .hub-tile {
    --tile-accent: var(--accent);
    display: flex;
    flex-direction: column;
    min-height: 300px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--tile-accent);
    border-radius: 2px;
    padding: 28px;
    text-decoration: none;
    color: var(--text);
    transition: transform 160ms ease-out, border-color 160ms ease-out;
  }

  .hub-tile:hover,
  .hub-tile:focus-visible {
    transform: translateY(-4px);
    border-color: var(--tile-accent);
  }

  .tile-no {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--tile-accent);
    margin-bottom: 24px;
  }

  .tile-title {
    margin: 0 0 12px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.2;
  }

  .tile-summary {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
    flex: 1;
  }

  .tile-hint {
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--tile-accent);
  }

  @media (max-width: 900px) {
    .hub-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 767px) {
    .board-header { padding: 24px 20px 8px; }
    .section-label { padding: 20px 20px 0; }
    main { padding: 8px 20px 72px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hub-tile { transition: none; }
    html, body { transition: none !important; }
  }
</style>
</head>
<body>

<header class="board-header">
  <a class="brand" href="index.html">SUNGWOO'S PROJECT HUB</a>
  <div class="header-right">
    <span class="clock" aria-hidden="true">
      <span class="dot"></span>
      <span id="clock-text">SEL --:--</span>
    </span>
    <button type="button" class="mode-toggle" id="mode-toggle" aria-label="라이트 모드로 전환">
      <span id="mode-toggle-text">LIGHT</span>
    </button>
    <button type="button" class="mode-toggle" id="lang-toggle" aria-label="Switch to English">
      <span id="lang-toggle-text">ENG</span>
    </button>
  </div>
</header>

<p class="section-label mono" data-i18n="sectionLabel">HUB</p>

<main>
  <h1 data-i18n="h1">둘러볼 항목을 선택하세요</h1>

  <div class="hub-grid">
    <a class="hub-tile" href="capabilities.html" style="--tile-accent:var(--chip-cyan);">
      <span class="tile-no mono">01</span>
      <h2 class="tile-title">CAPABILITIES</h2>
      <p class="tile-summary" data-i18n="tile1">AI 활용 방식, 어학·해외 실무 경험, 자격증 등 스킬 레퍼런스입니다.</p>
      <span class="tile-hint" data-i18n="hint">자세히 보기 →</span>
    </a>

    <a class="hub-tile" href="portfolio.html" style="--tile-accent:var(--chip-orange);">
      <span class="tile-no mono">02</span>
      <h2 class="tile-title">PORTFOLIO</h2>
      <p class="tile-summary" data-i18n="tile2">여행업 4년의 실무 경험을 케이스 스터디로 재구성했습니다. COSTPILOT 프로젝트도 여기 있습니다.</p>
      <span class="tile-hint" data-i18n="hint">자세히 보기 →</span>
    </a>

    <a class="hub-tile" href="projects.html" style="--tile-accent:var(--chip-green);">
      <span class="tile-no mono">03</span>
      <h2 class="tile-title">PROJECTS</h2>
      <p class="tile-summary" data-i18n="tile3">AI로 직접 기획하고 만든 데모 서비스 8종입니다. 카드를 클릭하면 바로 사용해볼 수 있습니다.</p>
      <span class="tile-hint" data-i18n="hint">자세히 보기 →</span>
    </a>
  </div>
</main>

<script>
  // clock
  (function () {
    var el = document.getElementById('clock-text');
    var formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Seoul',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    function tick() { el.textContent = 'SEL ' + formatter.format(new Date()); }
    tick();
    setInterval(tick, 10000);
  })();

  // theme toggle
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('mode-toggle');
    var label = document.getElementById('mode-toggle-text');

    function applyLabel(theme) {
      label.textContent = theme === 'light' ? 'DARK' : 'LIGHT';
      btn.setAttribute('aria-label', theme === 'light' ? '다크 모드로 전환' : '라이트 모드로 전환');
    }

    applyLabel(root.getAttribute('data-theme') || 'dark');

    btn.addEventListener('click', function () {
      var next = (root.getAttribute('data-theme') || 'dark') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      applyLabel(next);
    });
  })();

  // language toggle
  (function () {
    var I18N = {
      ko: {
        sectionLabel: 'HUB',
        h1: '둘러볼 항목을 선택하세요',
        tile1: 'AI 활용 방식, 어학·해외 실무 경험, 자격증 등 스킬 레퍼런스입니다.',
        tile2: '여행업 4년의 실무 경험을 케이스 스터디로 재구성했습니다. COSTPILOT 프로젝트도 여기 있습니다.',
        tile3: 'AI로 직접 기획하고 만든 데모 서비스 8종입니다. 카드를 클릭하면 바로 사용해볼 수 있습니다.',
        hint: '자세히 보기 →',
        title: "메뉴 | Sungwoo's Project Hub",
        description: 'Capabilities, Portfolio, Projects 세 영역으로 구성된 김성우의 프로젝트 허브 메뉴입니다. 원하는 항목을 선택해 자세히 살펴보세요.'
      },
      en: {
        sectionLabel: 'HUB',
        h1: 'Choose where to start',
        tile1: 'A skills reference covering AI usage, language ability, overseas work experience, and certifications.',
        tile2: '4 years in the travel industry, reframed as case studies — including the COSTPILOT project.',
        tile3: '8 demo services planned and built with AI. Click a card to try it right away.',
        hint: 'Learn more →',
        title: "Menu | Sungwoo's Project Hub",
        description: "Menu for Sungwoo's project hub, organized into Capabilities, Portfolio, and Projects. Pick a section to explore."
      }
    };

    var root = document.documentElement;
    var btn = document.getElementById('lang-toggle');
    var label = document.getElementById('lang-toggle-text');

    function apply(lang) {
      var dict = I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var k = el.getAttribute('data-i18n');
        if (dict[k] != null) el.textContent = dict[k];
      });
      document.title = dict.title;
      var metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', dict.description);
      root.setAttribute('lang', lang);
      label.textContent = lang === 'en' ? 'KOR' : 'ENG';
      btn.setAttribute('aria-label', lang === 'en' ? '한국어로 전환' : 'Switch to English');
    }

    apply(root.getAttribute('lang') === 'en' ? 'en' : 'ko');

    btn.addEventListener('click', function () {
      var next = root.getAttribute('lang') === 'en' ? 'ko' : 'en';
      try { localStorage.setItem('lang', next); } catch (e) {}
      apply(next);
    });
  })();
</script>

</body>
</html>
