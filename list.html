<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sungwoo's Project — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #14161A;
    --panel: #1C2026;
    --rule: #2C323A;
    --text: #F2F4F6;
    --text-dim: #8A93A0;
    --accent: #2FB3C9;
    --arrived: #4FBF7B;
    --boarding: #E8A33D;
    --scheduled: #8A93A0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body.modal-open { overflow: hidden; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: inherit; }

  /* header */
  .board-header {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 32px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: var(--text);
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .nav-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: var(--text-dim);
    transition: color 80ms ease-out;
  }

  .nav-link:hover,
  .nav-link:focus-visible { color: var(--accent); }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clock .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(47, 179, 201, 0.15);
  }

  .section-label {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 32px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
  }

  /* carousel */
  .carousel-section {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 0 8px;
  }

  .carousel-viewport {
    overflow-x: auto;
    overflow-y: visible;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    padding: 12px 32px 28px;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }

  .carousel-track {
    display: flex;
    gap: 20px;
    width: max-content;
  }

  .carousel-card {
    --card-accent: var(--accent);
    position: relative;
    flex: 0 0 min(82vw, 300px);
    width: min(82vw, 300px);
    min-height: 380px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--card-accent);
    border-radius: 2px;
    padding: 24px;
    scroll-snap-align: center;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 160ms ease-out;
  }

  .carousel-card:not(.is-open):hover,
  .carousel-card:not(.is-open):focus-visible {
    transform: translateY(-4px);
    border-color: var(--card-accent);
  }

  .carousel-card:not(.is-open) {
    transition: transform 160ms ease-out, border-color 160ms ease-out;
  }

  .carousel-card[data-status="scheduled"] { cursor: default; }
  .carousel-card[data-status="scheduled"] .card-hint { color: var(--scheduled); }

  .card-placeholder {
    visibility: hidden;
    border-top-color: transparent;
  }

  .card-face {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .card-no {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--card-accent);
  }

  .card-title {
    margin: 0 0 12px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: 0;
    color: var(--text);
  }

  .card-summary {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
    flex: 1;
    white-space: pre-line;
  }

  .card-hint {
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--card-accent);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .status-arrived { color: var(--arrived); }
  .status-arrived .dot { background: var(--arrived); }

  .status-boarding { color: var(--boarding); }
  .status-boarding .dot {
    background: var(--boarding);
    animation: pulse 3s ease-in-out infinite;
  }

  .status-scheduled { color: var(--scheduled); }
  .status-scheduled .dot {
    background: transparent;
    border: 1px solid var(--scheduled);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* carousel controls */
  .carousel-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 32px 8px;
  }

  .car-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 80ms ease-out, color 80ms ease-out;
  }

  .car-btn:hover,
  .car-btn:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  .car-dots {
    display: flex;
    gap: 8px;
  }

  .car-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rule);
    border: none;
    padding: 0;
    cursor: pointer;
  }

  .car-dot.active { background: var(--accent); }

  /* detail (flip-expanded card) */
  .card-detail { display: none; }

  .carousel-card.is-open {
    position: fixed;
    inset: 0;
    margin: auto;
    width: min(640px, 92vw);
    height: min(720px, 86vh);
    z-index: 100;
    cursor: default;
    padding: 0;
    border-color: var(--rule);
  }

  .carousel-card.is-open .card-face { display: none; }

  .carousel-card.content-visible .card-face { display: none; }
  .carousel-card.content-visible .card-detail {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .detail-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 24px 24px 0;
  }

  .detail-title-group { flex: 1; min-width: 0; }

  .detail-no {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .detail-title {
    margin: 0 0 8px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .detail-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    flex: 0 0 auto;
    transition: color 80ms ease-out;
  }

  .detail-close:hover,
  .detail-close:focus-visible { color: var(--text); }

  .detail-rule {
    height: 1px;
    background: var(--rule);
    margin: 16px 24px 0;
  }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 24px;
    opacity: 0;
    transition: opacity 220ms ease-out;
  }

  .carousel-card.content-visible .detail-body { opacity: 1; }

  .detail-section { margin-bottom: 24px; }
  .detail-section:last-of-type { margin-bottom: 0; }

  .detail-section h3 {
    margin: 0 0 8px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--text);
  }

  .detail-section p {
    margin: 0;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    letter-spacing: 0;
    max-width: 70ch;
    color: var(--text);
  }

  .detail-section ul {
    margin: 0;
    padding-left: 18px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    letter-spacing: 0;
  }

  .detail-section li { margin-bottom: 6px; }
  .detail-section li:last-child { margin-bottom: 0; }

  .detail-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 16px;
    margin-top: 20px;
    border-top: 1px solid var(--rule);
  }

  .stack-tag {
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 4px 10px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--text-dim);
  }

  /* scrim */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 13, 0.72);
    z-index: 90;
    opacity: 0;
    transition: opacity 200ms ease-out;
  }

  .scrim[hidden] { display: none; }
  .scrim.show { opacity: 1; }

  /* toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translate(-50%, 12px);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 12px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease-out, transform 160ms ease-out;
    z-index: 200;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast strong { color: var(--scheduled); }

  @media (max-width: 767px) {
    .board-header { padding: 24px 20px 8px; }
    .section-label { padding: 20px 20px 0; }
    .carousel-viewport { padding: 12px 20px 24px; }
    .carousel-controls { padding: 0 20px 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status-boarding .dot { animation: none; opacity: 1; }
    .scrim { transition: none; }
    .carousel-card:not(.is-open) { transition: none; }
    .detail-body { transition: none; }
  }
</style>
</head>
<body>

<header class="board-header">
  <a class="brand" href="index.html">SUNGWOO'S PROJECT</a>
  <div class="nav-right">
    <a class="nav-link" href="capabilities.html">CAPABILITIES</a>
    <span class="clock" aria-hidden="true">
      <span class="dot"></span>
      <span id="clock-text">SEL --:--</span>
    </span>
  </div>
</header>

<p class="section-label mono">PROJECTS — SWIPE OR CLICK ▸</p>

<main class="carousel-section">
  <div class="carousel-viewport" id="carousel-viewport">
    <div class="carousel-track" id="carousel-track"></div>
  </div>
  <div class="carousel-controls">
    <button class="car-btn" id="car-prev" type="button" aria-label="이전 프로젝트">‹</button>
    <div class="car-dots" id="car-dots"></div>
    <button class="car-btn" id="car-next" type="button" aria-label="다음 프로젝트">›</button>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Flip.min.js"></script>
<script>
  gsap.registerPlugin(Flip);

  var STATUS_LABEL = { arrived: 'ARRIVED', boarding: 'BOARDING', scheduled: 'SCHEDULED' };
  var CARD_COLORS = ['#2FB3C9', '#8A93A0', '#C77DFF', '#E8A33D'];
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var projects = [
    {
      no: '01',
      name: 'COSTPILOT',
      summary: '담당자마다 제각각인 여행상품 원가표를 표준화·자동화하는 웹 도구',
      status: 'boarding',
      detail: {
        problem: '원가표 양식이 담당자마다 달라 일원화되지 않았습니다. 수기 계산, 동일 로직의 4중 복제, 매직넘버 등 구조적 문제가 다수 있었습니다.',
        role: '기획 전 과정을 단독으로 수행했습니다 — As-Is 분석, PRD 작성, 데이터 모델 설계, 프로토타입 구현까지 직접 진행했습니다.',
        process: [
          '사내 CMS에 그대로 붙여넣을 수 있도록 sheet1 포맷을 유지하기로 결정',
          '프로모션·홈쇼핑 상품은 의도적으로 자동화 대상에서 제외',
          '단일 HTML + SheetJS 스택 선택',
          '양안정 구간은 낮은 쪽 값으로 고정하고 경고 배지로 표시'
        ],
        result: 'As-Is 분석 문서(P1~P7), PRD, 동작하는 MVP를 만들었습니다. 정량 성과는 아직 측정 방식이 확정되지 않아 별도로 표기하지 않습니다.',
        stack: ['HTML', 'JAVASCRIPT', 'SHEETJS', 'JSON', 'CLAUDE CODE']
      }
    },
    {
      no: '02',
      name: 'PORTFOLIO',
      summary: '여행업 4년의 실무 경험을 케이스 스터디로 재구성',
      status: 'scheduled',
      detail: null
    },
    {
      no: '03',
      name: "SUNGWOO'S PROJECT",
      summary: 'AI로 직접 기획하고 만든 이 프로젝트 허브',
      status: 'arrived',
      detail: {
        problem: '진행 중인 프로젝트가 여기저기 흩어져 있어 한 번에 보여줄 창구가 없었습니다.',
        role: '요구사항 정의, 정보 구조 설계, PRD 작성, 구현까지 전 과정을 직접 진행했습니다.',
        process: [
          '타겟을 채용 담당자로 한정 → 정보 밀도와 항목 수를 그에 맞춰 결정',
          '상세 콘텐츠를 별도 페이지가 아닌 모달로 → 이탈 최소화',
          '재방문·공유를 고려해 인트로를 건너뛸 수 있는 URL을 별도로 제공'
        ],
        result: '지금 보고 있는 이 사이트 자체가 산출물입니다.',
        stack: ['HTML', 'CSS', 'JAVASCRIPT', 'CLAUDE CODE']
      }
    },
    {
      no: '04',
      name: 'ICANEAT',
      summary: '뭐 먹을지 고민될 때 취향과 상황에 맞춰 메뉴를 추천해주는 서비스입니다.\n카드를 클릭하면 배포된 사이트로 바로 이동합니다.',
      status: 'arrived',
      link: 'https://icaneat-rust.vercel.app/',
      detail: null
    }
  ];

  var track = document.getElementById('carousel-track');
  var dotsWrap = document.getElementById('car-dots');
  var viewport = document.getElementById('carousel-viewport');
  var scrim = document.getElementById('scrim');
  var toast = document.getElementById('toast');
  var toastTimer = null;
  var openCard = null;
  var placeholder = null;

  function section(heading, html) {
    if (!html) return '';
    return '<div class="detail-section"><h3>' + heading + '</h3>' + html + '</div>';
  }

  function buildDetailHTML(project) {
    var d = project.detail;
    var html = '';
    html += section('문제 정의', d.problem ? '<p>' + d.problem + '</p>' : '');
    html += section('내 역할 · 기여도', d.role ? '<p>' + d.role + '</p>' : '');
    if (d.process && d.process.length) {
      html += section('진행 과정 · 의사결정', '<ul>' + d.process.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>');
    }
    html += section('결과 · 성과', d.result ? '<p>' + d.result + '</p>' : '');
    if (d.stack && d.stack.length) {
      html += '<div class="detail-stack">' + d.stack.map(function (s) { return '<span class="stack-tag">' + s + '</span>'; }).join('') + '</div>';
    }
    return html;
  }

  function buildCard(project, index) {
    var color = CARD_COLORS[index % CARD_COLORS.length];
    var card = document.createElement('article');
    card.className = 'carousel-card';
    card.dataset.status = project.status;
    card.style.setProperty('--card-accent', color);
    card.tabIndex = 0;

    var statusHTML = '<span class="status status-' + project.status + '"><span class="dot"></span>' + STATUS_LABEL[project.status] + '</span>';
    var hintText = project.status === 'scheduled'
      ? 'SCHEDULED — 준비 중'
      : (project.link ? '사이트 바로가기 ↗' : '자세히 보기 →');

    var faceHTML =
      '<div class="card-face">' +
        '<div class="card-top">' +
          '<span class="card-no mono">' + project.no + '</span>' +
          statusHTML +
        '</div>' +
        '<h3 class="card-title">' + project.name + '</h3>' +
        '<p class="card-summary">' + project.summary + '</p>' +
        '<span class="card-hint">' + hintText + '</span>' +
      '</div>';

    card.innerHTML = faceHTML;

    if (project.link) {
      card.setAttribute('role', 'link');
      card.setAttribute('aria-label', project.name + ' 사이트로 이동 (새 탭)');
      card.addEventListener('click', function () {
        window.open(project.link, '_blank', 'noopener');
      });
    } else if (project.status !== 'scheduled') {
      card.setAttribute('role', 'button');
      card.setAttribute('aria-haspopup', 'dialog');
      card.setAttribute('aria-expanded', 'false');
      card.setAttribute('aria-label', project.name + ' 상세 보기, 상태 ' + STATUS_LABEL[project.status]);

      var detailWrap = document.createElement('div');
      detailWrap.className = 'card-detail';
      detailWrap.innerHTML =
        '<div class="detail-header">' +
          '<div class="detail-title-group">' +
            '<span class="detail-no mono">' + project.no + '</span>' +
            '<h2 class="detail-title">' + project.name + '</h2>' +
            statusHTML +
          '</div>' +
          '<button class="detail-close" type="button" aria-label="닫기">✕</button>' +
        '</div>' +
        '<div class="detail-rule"></div>' +
        '<div class="detail-body">' + buildDetailHTML(project) + '</div>';
      card.appendChild(detailWrap);

      card.addEventListener('click', function (e) {
        if (card.classList.contains('is-open')) return;
        openDetail(card);
      });

      detailWrap.querySelector('.detail-close').addEventListener('click', function (e) {
        e.stopPropagation();
        closeDetail();
      });
    } else {
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', project.name + ', ' + STATUS_LABEL[project.status] + ' — 준비 중');
      card.addEventListener('click', function () { showToast(); });
    }

    card.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && !card.classList.contains('is-open')) {
        e.preventDefault();
        card.click();
      }
    });

    return card;
  }

  projects.forEach(function (project, i) {
    track.appendChild(buildCard(project, i));

    var dot = document.createElement('button');
    dot.className = 'car-dot';
    dot.type = 'button';
    dot.setAttribute('aria-label', project.name + '로 이동');
    dot.addEventListener('click', function () {
      var cards = track.querySelectorAll('.carousel-card');
      cards[i].scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
    });
    dotsWrap.appendChild(dot);
  });

  var dots = dotsWrap.querySelectorAll('.car-dot');

  function updateActiveDot() {
    var cards = Array.prototype.slice.call(track.querySelectorAll('.carousel-card'));
    var center = viewport.scrollLeft + viewport.clientWidth / 2;
    var closest = 0;
    var minDist = Infinity;
    cards.forEach(function (c, i) {
      var mid = c.offsetLeft + c.offsetWidth / 2;
      var dist = Math.abs(mid - center);
      if (dist < minDist) { minDist = dist; closest = i; }
    });
    dots.forEach(function (d, i) { d.classList.toggle('active', i === closest); });
  }

  var scrollTimer = null;
  viewport.addEventListener('scroll', function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(updateActiveDot, 80);
  });
  updateActiveDot();

  document.getElementById('car-prev').addEventListener('click', function () {
    viewport.scrollBy({ left: -320, behavior: REDUCED ? 'auto' : 'smooth' });
  });
  document.getElementById('car-next').addEventListener('click', function () {
    viewport.scrollBy({ left: 320, behavior: REDUCED ? 'auto' : 'smooth' });
  });

  // Flip open / close
  function openDetail(card) {
    if (openCard) return;
    openCard = card;

    placeholder = document.createElement('div');
    placeholder.className = 'carousel-card card-placeholder';
    card.parentNode.insertBefore(placeholder, card);

    var state = Flip.getState(card, { props: 'borderRadius' });

    document.body.appendChild(card);
    card.classList.add('is-open');
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-modal', 'true');
    card.setAttribute('aria-expanded', 'true');
    card.tabIndex = -1;

    document.body.classList.add('modal-open');
    scrim.hidden = false;
    requestAnimationFrame(function () { scrim.classList.add('show'); });

    Flip.from(state, {
      duration: REDUCED ? 0 : 0.6,
      ease: 'power3.inOut',
      scale: true,
      onComplete: function () {
        gsap.set(card, { clearProps: 'transform,borderRadius' });
        card.classList.add('content-visible');
        var closeBtn = card.querySelector('.detail-close');
        if (closeBtn) closeBtn.focus();
      }
    });

    document.addEventListener('keydown', onKeydown);
  }

  function closeDetail() {
    if (!openCard) return;
    var card = openCard;

    card.classList.remove('content-visible');

    var state = Flip.getState(card, { props: 'borderRadius' });

    placeholder.replaceWith(card);
    card.classList.remove('is-open');
    card.setAttribute('role', 'button');
    card.removeAttribute('aria-modal');
    card.setAttribute('aria-expanded', 'false');
    card.tabIndex = 0;
    scrim.classList.remove('show');

    Flip.from(state, {
      duration: REDUCED ? 0 : 0.45,
      ease: 'power2.inOut',
      scale: true,
      onComplete: function () {
        gsap.set(card, { clearProps: 'transform,borderRadius' });
        document.body.classList.remove('modal-open');
        scrim.hidden = true;
        card.focus();
        updateActiveDot();
      }
    });

    openCard = null;
    placeholder = null;
    document.removeEventListener('keydown', onKeydown);
  }

  function onKeydown(e) {
    if (e.key === 'Escape') closeDetail();
  }

  scrim.addEventListener('click', closeDetail);

  function showToast() {
    toast.innerHTML = '<strong>SCHEDULED</strong> — 준비 중입니다.';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  // clock
  (function () {
    var el = document.getElementById('clock-text');
    var formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Seoul',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    function tick() { el.textContent = 'SEL ' + formatter.format(new Date()); }
    tick();
    setInterval(tick, 10000);
  })();
</script>

</body>
</html>
